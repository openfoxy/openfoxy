name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Proxy e2e (Docker)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Single-host suite
        run: npm run test:e2e
      - name: Two-container residential suite
        run: npm run test:e2e:residential
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f e2e/docker-compose.yml logs || true
          docker compose -f e2e/docker-compose.two-container.yml logs || true
